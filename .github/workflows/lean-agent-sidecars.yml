name: Lean agent sidecars

on:
  push:
    paths:
      - "examples/**/*.lean"
      - "examples/**/verify.sh"
      - "examples/**/lean-toolchain"
      - "examples/**/lakefile.lean"
      - "examples/**/lakefile.toml"
      - ".github/workflows/lean-agent-sidecars.yml"
  pull_request:
    paths:
      - "examples/**/*.lean"
      - "examples/**/verify.sh"
      - "examples/**/lean-toolchain"
      - "examples/**/lakefile.lean"
      - "examples/**/lakefile.toml"
      - ".github/workflows/lean-agent-sidecars.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-agent-sidecars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-sidecars:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ELAN_VERSION: v4.2.3
      ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
      FLT_REPO_SHA: aa2d8b34692b16c70f699536de0d8e75b9a3e9ef
      FLT_MATHLIB_SHA: db584cd6d46c92f209a44c0f1c829460d327499d
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      # Some focused Route-B sidecars intentionally reuse the pinned local-FKG
      # Lake environment, whose dependency is the pinned formal-math tree.
      - name: Check out pinned formal-math dependency
        uses: actions/checkout@v4
        with:
          repository: anthropics/formal-math
          ref: 795efb86f191735c5481675763537cfb4ff37e55
          path: upstream/formal-math
          persist-credentials: false

      # Keep the exact FLT source checkout for provenance/source binding.  The
      # upstream README explicitly states that Lean 4.33.1 has no matching
      # prebuilt Mathlib cache and therefore requires a full source build.
      - name: Check out pinned Anthropic FLT source
        uses: actions/checkout@v4
        with:
          repository: anthropics/fermats-last-theorem
          ref: aa2d8b34692b16c70f699536de0d8e75b9a3e9ef
          path: upstream/anthropic-flt
          persist-credentials: false

      # Portable CI only performs a compatibility compile of the extracted
      # quotient API against the exact Mathlib revision used by FLT, using that
      # revision's own Lean 4.33.0 toolchain and official cache.  This is not an
      # exact replay of FLT's Lean 4.33.1 source-built environment.
      - name: Check out pinned Mathlib compatibility environment
        uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: db584cd6d46c92f209a44c0f1c829460d327499d
          path: upstream/mathlib-flt-quotient
          persist-credentials: false

      - name: Install checksum-verified Elan
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$ELAN_SHA256" "$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Bootstrap pinned local-FKG Lake environment
        run: |
          set -euo pipefail
          cd examples/local_fkg
          echo "LOCAL_FKG_TOOLCHAIN=$(cat lean-toolchain)"
          lake --version
          lake update
          lake build

      - name: Validate pinned Anthropic FLT provenance
        run: |
          set -euo pipefail
          cd upstream/anthropic-flt
          test "$(git rev-parse HEAD)" = "$FLT_REPO_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.33.1"
          grep -F "\"rev\": \"$FLT_MATHLIB_SHA\"" lake-manifest.json >/dev/null
          echo "FLT_TOOLCHAIN=$(cat lean-toolchain)"
          echo "FLT_MATHLIB_SHA=$FLT_MATHLIB_SHA"
          echo "FLT_PORTABLE_REPLAY=source-provenance-only"

      - name: Bootstrap pinned Mathlib compatibility environment
        run: |
          set -euo pipefail
          cd upstream/mathlib-flt-quotient
          test "$(git rev-parse HEAD)" = "$FLT_MATHLIB_SHA"
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.33.0"
          echo "FLT_MATHLIB_COMPAT_TOOLCHAIN=$(cat lean-toolchain)"
          lake --version
          lake exe cache get

      - name: Run portable agent sidecars
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find examples -type f -name verify.sh -print | sort)
          ran=0
          failed=0
          for script in "${scripts[@]}"; do
            if grep -q 'CI_PORTABLE=1' "$script"; then
              echo "::group::Running $script"
              if [[ "$script" == "examples/anthropic_flt_quotient_transport_sidecar/verify.sh" ]]; then
                if SOURCE_ROOT="$GITHUB_WORKSPACE/upstream/anthropic-flt" \
                    LAKE_ROOT="$GITHUB_WORKSPACE/upstream/mathlib-flt-quotient" \
                    bash "$script"; then
                  echo "SIDECAR_RESULT=PASS path=$script"
                else
                  code=$?
                  echo "SIDECAR_RESULT=FAIL path=$script exit_code=$code"
                  echo "::error title=Portable sidecar failed::$script exited with $code"
                  failed=1
                fi
              elif bash "$script"; then
                echo "SIDECAR_RESULT=PASS path=$script"
              else
                code=$?
                echo "SIDECAR_RESULT=FAIL path=$script exit_code=$code"
                echo "::error title=Portable sidecar failed::$script exited with $code"
                failed=1
              fi
              echo "::endgroup::"
              ran=$((ran + 1))
            fi
          done
          echo "PORTABLE_SIDECARS_RUN=$ran"
          echo "PORTABLE_SIDECARS_FAILED=$failed"
          if [[ "$ran" -eq 0 ]]; then
            echo "No CI_PORTABLE=1 sidecars registered yet."
          fi
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

      - name: Record Lean/Lake versions
        if: always()
        run: |
          {
            echo "elan: $(elan --version 2>&1 || true)"
            cd examples/local_fkg
            echo "local_fkg toolchain: $(cat lean-toolchain)"
            echo "local_fkg lake: $(lake --version 2>&1 || true)"
            echo "local_fkg lean: $(lean --version 2>&1 || true)"
            cd "$GITHUB_WORKSPACE/upstream/anthropic-flt"
            echo "flt repo sha: $(git rev-parse HEAD 2>&1 || true)"
            echo "flt upstream toolchain: $(cat lean-toolchain 2>&1 || true)"
            echo "flt mathlib sha: $FLT_MATHLIB_SHA"
            cd "$GITHUB_WORKSPACE/upstream/mathlib-flt-quotient"
            echo "flt compatibility mathlib sha: $(git rev-parse HEAD 2>&1 || true)"
            echo "flt compatibility toolchain: $(cat lean-toolchain 2>&1 || true)"
            echo "flt compatibility lake: $(lake --version 2>&1 || true)"
            echo "flt compatibility lean: $(lean --version 2>&1 || true)"
          } | tee "$RUNNER_TEMP/lean-agent-environment.txt"

      - name: Upload Lean environment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-agent-environment
          path: ${{ runner.temp }}/lean-agent-environment.txt
          if-no-files-found: error
          retention-days: 14
